
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Your Special Benefits</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#eef7ff,#dcecff);
  padding:20px;
}
.card{
  width:min(720px,100%);
  background:#fff;
  border-radius:24px;
  padding:34px 24px 30px;
  text-align:center;
  box-shadow:0 18px 55px rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.9);
}
.icon{font-size:54px;margin-bottom:8px}
h1{margin:0 0 12px;font-size:clamp(28px,5vw,46px);color:#172033}
.sub{margin:0 auto 26px;max-width:580px;color:#596579;font-size:17px;line-height:1.6}
.timer{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:560px;
  margin:0 auto 28px;
}
.box{
  background:#172033;
  color:#fff;
  border-radius:14px;
  padding:14px 6px;
}
.num{display:block;font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1}
.label{display:block;margin-top:7px;font-size:11px;letter-spacing:1.2px;font-weight:700;opacity:.8}
button{
  width:min(430px,100%);
  border:0;
  border-radius:999px;
  padding:17px 30px;
  font-size:20px;
  font-weight:800;
  color:#fff;
  background:linear-gradient(90deg,#1473ff,#7b35ff);
  cursor:pointer;
  box-shadow:0 10px 28px rgba(68,78,255,.35);
  transition:transform .2s,opacity .2s;
}
button:not(:disabled):hover{transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.note{margin-top:15px;font-size:13px;color:#7a8494}
@media(max-width:480px){
  body{padding:12px}
  .card{padding:28px 15px 24px;border-radius:18px}
  .timer{gap:6px}
  .box{padding:12px 3px}
  .sub{font-size:15px}
}
</style>
</head>
<body>
<main class="card">
  <div class="icon">🎁</div>
  <h1>Unlock Your Special Benefits!</h1>
  <p class="sub">
    Don't miss this limited-time opportunity. Your next step will be available
    when the countdown ends.
  </p>

  <div class="timer" aria-label="Countdown">
    <div class="box"><span class="num" id="days">00</span><span class="label">DAYS</span></div>
    <div class="box"><span class="num" id="hours">00</span><span class="label">HOURS</span></div>
    <div class="box"><span class="num" id="minutes">00</span><span class="label">MINUTES</span></div>
    <div class="box"><span class="num" id="seconds">10</span><span class="label">SECONDS</span></div>
  </div>

  <button id="continueBtn" disabled>Continue in 10s</button>
  <div class="note">Please wait for the countdown to finish.</div>
</main>

<script>
(function(){
  const target = "https://www.profitableratecpmnetwork.com/gghx0di8gn?key=8bbfe0a27ad69555f8e3ac617c816fb7";
  let remaining = 10;

  const d = document.getElementById("days");
  const h = document.getElementById("hours");
  const m = document.getElementById("minutes");
  const s = document.getElementById("seconds");
  const btn = document.getElementById("continueBtn");

  function render(){
    d.textContent = "00";
    h.textContent = "00";
    m.textContent = "00";
    s.textContent = String(remaining).padStart(2,"0");

    if(remaining <= 0){
      btn.disabled = false;
      btn.textContent = "Continue";
      document.querySelector(".note").textContent = "You can continue now.";
    }else{
      btn.textContent = "Continue in " + remaining + "s";
    }
  }

  render();

  const timer = setInterval(function(){
    remaining--;
    render();
    if(remaining <= 0) clearInterval(timer);
  },1000);

  btn.addEventListener("click", function(){
    if(!btn.disabled) window.location.href = target;
  });
})();
</script>
</body>
</html>
